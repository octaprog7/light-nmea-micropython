[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "light-nmea-micropython"
version = "1.0.1"
description = "Fast, NMEA 0183 parser for Python and MicroPython"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "octaprog7"}
]
keywords = ["nmea", "gps", "gnss", "micropython", "parser", "embedded", "zero-allocation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/octaprog7/light-nmea-micropython"
